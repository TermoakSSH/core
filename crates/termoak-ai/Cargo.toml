[package]
name = "termoak-ai"
description = "Termoak AI engine: multi-provider (Claude, OpenAI, Codex, OpenCode Go, local), agent with SSH tools, background tasks and MCP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
termoak-core.workspace = true
termoak-ssh.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
bytes.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
reqwest.workspace = true
url.workspace = true
uuid.workspace = true
chrono.workspace = true
parking_lot.workspace = true
base64.workspace = true
zeroize.workspace = true
# Antigravity (`agy`) prints nothing without a terminal: it runs under a
# pseudo-terminal (feature `pty`, used by the desktop app).
portable-pty = { version = "0.9", optional = true }

[features]
pty = ["dep:portable-pty"]

[dev-dependencies]
axum.workspace = true
