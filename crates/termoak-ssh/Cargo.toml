[package]
name = "termoak-ssh"
description = "Termoak SSH engine: terminal, exec, SFTP, tunnels, jump hosts and recording; Telnet terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
termoak-core.workspace = true
russh.workspace = true
russh-sftp.workspace = true
tokio.workspace = true
base64.workspace = true
bytes.workspace = true
futures.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
parking_lot.workspace = true
rand.workspace = true
zeroize.workspace = true
sha2.workspace = true

[features]
# Test-only software FIDO2 authenticator (`sk::soft`): never in apps or the
# server binary (its key handles contain the private key).
soft-sk = []

[dev-dependencies]
tempfile = "3"

[[test]]
name = "security_keys"
required-features = ["soft-sk"]
