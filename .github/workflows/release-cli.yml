name: Release CLI

# Publishes cli with the version in its manifest as the
# cli-vX.Y.Z release. Only runs by hand (Actions > Release CLI > Run
# workflow). The same from your machine, without Actions:
#   scripts/release-local.sh build cli && scripts/release-local.sh publish cli
# (the last step here is that same script, so releases come out identical).
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: echo "version=$(scripts/release-local.sh version cli)" >> "$GITHUB_OUTPUT"
      - name: That version is not published yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: cli-v${{ steps.version.outputs.version }}
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          if [ "$status" = 200 ]; then
            echo "::error::Release $TAG already exists: bump the version with scripts/release-local.sh version cli X.Y.Z"
            exit 1
          fi

  binaries:
    name: cli (${{ matrix.name }})
    needs: check
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, name: linux-aarch64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-aarch64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64 }

    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Separate per image: what is built on Ubuntu 24.04 does not load on 22.04.
          key: ${{ matrix.os }}-${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p termoak-cli
      - name: Package
        shell: bash
        run: |
          # Same as package_bin in scripts/release-local.sh.
          ext=""; [[ "${{ runner.os }}" == "Windows" ]] && ext=".exe"
          d="termoak-cli-v$VERSION-${{ matrix.name }}"
          mkdir -p dist "$d"
          cp "target/${{ matrix.target }}/release/termoak$ext" README.md "$d/"
          if [[ "${{ runner.os }}" == "Windows" ]]; then 7z a "dist/$d.zip" "$d"; else tar czf "dist/$d.tar.gz" "$d"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: dist/*
          # Only needed until publishing.
          retention-days: 3

  publish:
    name: Publish
    needs: [check, binaries]
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      COMMIT: ${{ github.sha }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The script checks that the commit is pushed and writes the notes
          # since the previous version.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist/cli
          merge-multiple: true
      - run: echo "cli-v$VERSION" > "dist/cli/.version"
      - name: Publish
        run: scripts/release-local.sh publish cli
